name: Verify offline model download

# Checks the exact command Vercel runs (`prebuild`) against the real Hugging Face repository, on a
# machine with unrestricted internet. It is manual on purpose: it downloads ~137 MB, so it should
# not run for every push. Use it when the model must be re-verified (new model revision, changed
# manifest, or "does the download still work?").
#
# Run: Actions → Verify offline model download → Run workflow (choose any branch), or
#      gh workflow run verify-shenava-model.yml --ref <branch>

on:
  workflow_dispatch:
  # Temporary trigger while this workflow is verified on its own branch; removed before merge.
  push:
    branches:
      - arena/5e7068da-billora

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Download the model (same script as the build step)
        run: node scripts/download-shenava-model.mjs --strict
        env:
          SHENAVA_MODEL_STRICT: '1'
      - name: Show what was downloaded
        run: |
          ls -l public/models/shenava
          echo "--- sha256 ---"
          sha256sum public/models/shenava/*
      - name: Check the files match the manifest in the app
        run: node scripts/download-shenava-model.mjs --check
      - name: Build and confirm the model is inside dist
        run: |
          npm run build
          ls -l dist/models/shenava
