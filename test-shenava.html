<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <title>Billora — آزمایش موتور گفتار آفلاین شنوا</title>
    <style>
      :root { --green-900: #0f4a41; --green-700: #1c7a67; --paper: #f6f7f4; --line: #e2e7e1; }
      * { box-sizing: border-box; }
      body { margin: 0; padding: 18px; background: var(--paper); color: #33413a; font-family: Vazirmatn, "Segoe UI", Tahoma, sans-serif; line-height: 1.9; }
      .wrap { max-width: 780px; margin: 0 auto; display: grid; gap: 14px; }
      header h1 { margin: 0 0 6px; font-size: 19px; color: var(--green-900); }
      .lead { margin: 0; font-size: 12px; color: #6c7a72; }
      .card { padding: 14px; background: #fff; border: 1px solid var(--line); border-radius: 12px; }
      .card h2 { margin: 0 0 10px; font-size: 14px; color: var(--green-900); }
      .metric-row { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding: 5px 0; border-bottom: 1px dashed #eef1ee; font-size: 11px; }
      .metric-row span { color: #7d8a83; }
      .metric-row strong { font-weight: 600; direction: ltr; text-align: left; word-break: break-all; }
      h3 { margin: 14px 0 6px; font-size: 12px; color: var(--green-700); }
      .table-wrap { overflow-x: auto; margin: 8px 0; }
      table.files { width: 100%; border-collapse: collapse; font-size: 10px; }
      table.files th, table.files td { padding: 5px 6px; text-align: right; border-bottom: 1px solid #eef1ee; white-space: nowrap; }
      table.files th { font-weight: 600; color: #7d8a83; background: #fafcfa; }
      table.files td { color: #45524b; }
      .row { display: flex; flex-wrap: wrap; gap: 8px; }
      .row button { padding: 8px 12px; font-size: 12px; color: var(--green-900); background: #f2f8f4; border: 1px solid #d9e9e0; border-radius: 9px; cursor: pointer; }
      .row button:hover:not(:disabled) { background: #e7f3ec; }
      .row button:disabled { opacity: .5; cursor: not-allowed; }
      .row button.primary { color: #fff; background: var(--green-700); border-color: var(--green-700); }
      .status { margin: 10px 0 0; font-size: 12px; color: #4c5c54; }
      .message { margin: 6px 0 0; padding: 8px 10px; font-size: 11px; color: #6d5a49; background: #fdf7f0; border: 1px solid #f1e3d4; border-radius: 9px; }
      .hint { margin: 10px 0 0; font-size: 11px; color: #7d8a83; }
      .field { display: grid; gap: 5px; margin-top: 12px; font-size: 11px; }
      textarea { width: 100%; padding: 9px; font: inherit; font-size: 13px; border: 1px solid var(--line); border-radius: 9px; resize: vertical; }
      .verdict { margin: 10px 0 0; font-size: 12px; color: var(--green-700); }
      code { padding: 1px 5px; background: #f1f5f1; border-radius: 5px; direction: ltr; unicode-bidi: embed; font-size: 11px; }
      .log { margin: 10px 0 0; padding: 0; list-style: none; font-size: 10px; color: #7a8880; }
      .log li { padding: 3px 0; border-bottom: 1px dotted #eef1ee; direction: ltr; text-align: left; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/speech/offline/diagnostic.tsx"></script>
  </body>
</html>
